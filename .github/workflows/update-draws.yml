name: Update draw results
on:
  schedule:
    # UK draws finish by about 21:00. Run late evening and again early morning (times are UTC).
    - cron: '25 22 * * *'
    - cron: '40 5 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/update_draws.py', '.github/workflows/update-draws.yml']
permissions:
  contents: write
concurrency:
  group: update-draws
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch new results
        run: python scripts/update_draws.py | tee update-log.txt
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data; then echo "No new draws"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update draw data" -m "$(grep added update-log.txt || true)"
          git pull --rebase origin main
          git push
